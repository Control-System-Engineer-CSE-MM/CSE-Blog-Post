# hugo.toml — Hugo ဝက်ဘ်ဆိုက် အဓိက ဆက်တင်များ (Hugo 0.167.0 အတွက် စစ်ဆေးထားသော key များကိုသာ သုံးထားသည်)
# မှတ်ချက် — ဤဖိုင်ကို local တွင် build မလုပ်ပါ။ GitHub Actions (.github/workflows/deploy.yml) က build လုပ်သည်

# baseURL ကို CI က `--baseURL` ဖြင့် အစားထိုးသဖြင့် ဤတန်ဖိုးသည် နမူနာသာ ဖြစ်သည်
baseURL = "https://example.org/"
title = "TODO(owner) ဘလော့ဂ်ခေါင်းစဉ်"

# မြန်မာဘာသာကို မူလအဖြစ် root တွင် ထုတ်ဝေပြီး English ကို /en/ အောက်တွင် ထုတ်ဝေသည်
defaultContentLanguage = "my"
defaultContentLanguageInSubdir = false

timeZone = "Asia/Yangon"
enableRobotsTXT = true
# "နောက်ဆုံးပြင်ဆင်ချိန်" ကို git မှ ယူရန် (CI တွင် fetch-depth: 0 လိုသည်)
enableGitInfo = true

# မြန်မာစာတွင် စာလုံးအကြီး/အသေး မရှိသဖြင့် စာရင်းခေါင်းစဉ်များကို ပြောင်းမလဲစေရန်
capitalizeListTitles = false
pluralizeListTitles = false

[pagination]
  # စာမျက်နှာတစ်ခုလျှင် ပို့စ် အရေအတွက် (E-Ink တွင် စာမျက်နှာလှန်ကဲ့သို့ ဖတ်ရန် အဆင်ပြေသည်)
  pagerSize = 10

[taxonomies]
  tag = "tags"

# --- ဘာသာစကားများ ---
[languages]
  [languages.my]
    label = "မြန်မာ"
    locale = "my"
    contentDir = "content/my"
    title = "TODO(owner) ဘလော့ဂ်ခေါင်းစဉ်"
    weight = 1
    [languages.my.params]
      description = "TODO(owner): ဤဘလော့ဂ်အကြောင်း တစ်ကြောင်းတည်း ဖော်ပြချက်"
      tagline = "TODO(owner): ဘလော့ဂ်၏ ဆောင်ပုဒ်"
  [languages.en]
    label = "English"
    locale = "en"
    contentDir = "content/en"
    title = "TODO(owner) Blog title"
    weight = 2
    [languages.en.params]
      description = "TODO(owner): one-line description of this blog"
      tagline = "TODO(owner): blog tagline"

# --- Markdown ---
[markup]
  [markup.goldmark.renderer]
    # နှစ်ဘာသာပြ <div class="bi"> block များအတွက် Markdown အတွင်း HTML ခွင့်ပြုရမည်
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      # $…$ နှင့် $$…$$ ကို GitHub preview တွင်လည်း မြင်ရစေရန် ထည့်ထားသည်
      # (သတိ — ညီမျှခြင်းမဟုတ်သော စာထဲတွင် $ ကို \\$ ဟု နှစ်ထပ် escape လုပ်ရမည်)
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    # code block ကို အရောင်မခြယ်ပါ (E-Ink တွင် အရောင်သုံး မအပ်စပ်ပါ) — CSS ၏ monospace ပုံစံကိုသာ သုံးသည်
    codeFences = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# --- ဆိုက်တစ်ခုလုံး params ---
[params]
  # "owner/repo" ပုံစံ — ဖြည့်ပြီးမှ "ဤစာမျက်နှာကို ပြင်ရန်" link နှင့် footer ရှိ source link ပေါ်မည်
  githubRepo = ""
  githubBranch = "main"
  author = "TODO(owner)"
