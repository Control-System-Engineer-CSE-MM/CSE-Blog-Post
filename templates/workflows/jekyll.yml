# Jekyll ဝက်ဘ်ဆိုက်ကို GitHub Actions ဖြင့် build လုပ်ပြီး GitHub Pages သို့ တင်သည့် workflow နမူနာ
# အသုံးပြုရန်: ဤဖိုင်ကို .github/workflows/deploy.yml အဖြစ် ကူးပြီး AI က "TODO(agent)" များကို ဖြည့်ရမည်
# မှတ်ချက် — Local တွင် Ruby/Bundler ကို install မလုပ်ပါ။ Actions ကို သုံးသဖြင့် github-pages gem မဟုတ်သော plugin များလည်း သုံးနိုင်သည်

name: Deploy site (Jekyll)

on:
  push:
    branches: [main]
  pull_request:               # PR တွင် build ကိုသာ စစ်သည် (မထုတ်ဝေ)
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Yangon
      JEKYLL_ENV: production
    steps:
      - name: Source ကို ရယူသည်
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Ruby ကို ပြင်ဆင်သည်
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "TODO"      # TODO(agent): Jekyll ပံ့ပိုးသော Ruby ဗားရှင်းကို စစ်ပြီး ထည့်ပါ
          bundler-cache: true       # Gemfile ရှိလျှင် bundle install နှင့် cache ကို လုပ်ပေးသည် (Gemfile ဗားရှင်းများ အတိအကျထားရန်)

      - name: Pages အချက်အလက် (base path) ရယူသည်
        id: pages
        uses: actions/configure-pages@v6

      - name: Content ကို စစ်ဆေးသည် (python3 stdlib၊ မပိတ်ဆို့)
        run: python3 scripts/check_content.py _posts _docs   # TODO(agent): content ဖိုလ်ဒါ လမ်းကြောင်းများကို ညှိပါ
        continue-on-error: true

      - name: Jekyll ဖြင့် build လုပ်သည်
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Pages artifact တင်သည်
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    # PR တွင် မထုတ်ဝေ၊ build မအောင်မြင်လျှင်လည်း မထုတ်ဝေ (needs ကြောင့်)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages သို့ ထုတ်ဝေသည်
        id: deployment
        uses: actions/deploy-pages@v5
